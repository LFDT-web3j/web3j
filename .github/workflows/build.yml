name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_PASSWORD:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  integration-test:
    runs-on: ubuntu-latest
    env:
      registry.username: ${{ secrets.REGISTRY_USERNAME }}
      registry.password: ${{ secrets.REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run integration tests
        run: |
          BUILD_FLAGS=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            BUILD_FLAGS+=(--no-build-cache)
          fi
          ./gradlew integration-tests:test -Pintegration-tests=true "${BUILD_FLAGS[@]}"
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Check formatting and run unit tests
        run: |
          BUILD_FLAGS=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            BUILD_FLAGS+=(--no-build-cache)
          fi
          # Use the reviewed formatter inputs already tracked in this checkout.
          ./gradlew check -x downloadJavaLicense -x downloadFormatterProperties "${BUILD_FLAGS[@]}"
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v5
