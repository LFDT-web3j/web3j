name: Release

run-name: ${{ github.event_name == 'push' && 'Release' || 'Release rehearsal' }} — ${{ github.ref_name }}

on:
  push:
    branches: [ 'release/**' ]
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
      - '**/*.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - 'gradlew'
  # Manual runs are always rehearsals, even when a release branch is selected.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and tag
        id: release_name
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/release/* ]]; then
            echo "version=0.0.0-rehearsal.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#release/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ || "$VERSION" == *-SNAPSHOT ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points to another commit." >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate:
    needs: preflight
    uses: ./.github/workflows/build.yml
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  release:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_name.outputs.version }}
      jars_artifact_id: ${{ steps.release_jars.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version and tag
        id: release_name
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/heads/release/* ]]; then
            echo "version=0.0.0-rehearsal.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#release/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ || "$VERSION" == *-SNAPSHOT ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points to another commit." >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Stage artifacts locally
        env:
          RELEASE_VERSION: ${{ steps.release_name.outputs.version }}
        run: ./gradlew "-Pversion=$RELEASE_VERSION" publishMavenPublicationToLocalStagingRepository --no-build-cache --stacktrace

      - name: Verify staged release artifacts
        env:
          RELEASE_VERSION: ${{ steps.release_name.outputs.version }}
        run: ./gradlew "-Pversion=$RELEASE_VERSION" :verifyReleaseArtifacts --no-build-cache --stacktrace

      - name: Record staged artifact checksums and source
        env:
          RELEASE_VERSION: ${{ steps.release_name.outputs.version }}
        run: |
          ARTIFACTS=()
          while IFS= read -r -d '' ARTIFACT; do
            ARTIFACTS+=("${ARTIFACT#./}")
          done < <(find . -type f -path "*/build/staging-deploy/org/web3j/*/$RELEASE_VERSION/*" -print0)
          if (( ${#ARTIFACTS[@]} == 0 )); then
            echo "No release artifacts were staged." >&2
            exit 1
          fi
          sha256sum "${ARTIFACTS[@]}" release-expected-files.txt > release-checksums.sha256
          printf 'commit=%s\nversion=%s\nevent=%s\n' \
            "$GITHUB_SHA" "$RELEASE_VERSION" "$GITHUB_EVENT_NAME" > release-metadata.txt

      - name: Save staged release artifacts
        id: release_jars
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ steps.release_name.outputs.version }}-${{ github.run_attempt }}
          path: |
            **/build/staging-deploy/org/web3j/*/${{ steps.release_name.outputs.version }}/*
            release-expected-files.txt
            release-checksums.sha256
            release-metadata.txt
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to Maven Central (Portal)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        env:
          RELEASE_VERSION: ${{ steps.release_name.outputs.version }}
          JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
        run: |
          sha256sum --check --strict release-checksums.sha256
          # Deploy the recorded staging files; do not execute the publishing dependency again.
          ./gradlew "-Pversion=$RELEASE_VERSION" jreleaserDeploy \
            -x publishMavenPublicationToLocalStagingRepository --no-build-cache --stacktrace
          # Signing may add .asc files, but must not change the recorded payload.
          sha256sum --check --strict release-checksums.sha256

  javadocs-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Generate Javadocs
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: bash ./gradlew "-Pversion=$RELEASE_VERSION" core:javadoc
      - name: Save rehearsal Javadocs
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-javadocs-${{ needs.release.outputs.version }}
          path: core/build/docs/javadoc/
          if-no-files-found: error
          retention-days: 14
      - name: Publish Javadocs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        env:
          GITHUB_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: bash ./gradlew "-Pversion=$RELEASE_VERSION" core:gitPublishPush

  git-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download staged release artifacts
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release.outputs.jars_artifact_id }}
          path: release-jars
          merge-multiple: true
      - name: Verify downloaded artifacts and source
        working-directory: release-jars
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          sha256sum --check --strict release-checksums.sha256
          # Reject unlisted files as well as missing or changed files.
          diff -u \
            <(cut -c 67- release-checksums.sha256 | LC_ALL=C sort) \
            <(find . -type f ! -path './release-checksums.sha256' ! -path './release-metadata.txt' \
              | sed 's#^\./##' | LC_ALL=C sort)
          printf 'commit=%s\nversion=%s\nevent=%s\n' \
            "$GITHUB_SHA" "$RELEASE_VERSION" "$GITHUB_EVENT_NAME" | cmp - release-metadata.txt
          test -s release-expected-files.txt
          while IFS= read -r EXPECTED; do
            if [[ ! -s "$EXPECTED" ]]; then
              echo "Missing or empty required publication: $EXPECTED" >&2
              exit 1
            fi
          done < release-expected-files.txt
          JAR_COUNT="$(find . -type f -name '*.jar' | wc -l)"
          if (( JAR_COUNT == 0 )); then
            echo "No release jars were downloaded." >&2
            exit 1
          fi
          {
            echo "### Release artifact verification"
            echo "Verified $JAR_COUNT JARs and all staged metadata checksums."
            echo "Version: $RELEASE_VERSION"
            echo "Commit: $GITHUB_SHA"
            if [[ "$GITHUB_EVENT_NAME" != push ]]; then
              echo "Rehearsal only: Maven Central, GitHub release and Javadoc publication are disabled."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release at the validated commit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          JARS=()
          while IFS= read -r -d '' JAR; do
            JARS+=("$JAR")
          done < <(find release-jars -type f -name '*.jar' -print0)
          if (( ${#JARS[@]} == 0 )); then
            echo "No published jars were downloaded." >&2
            exit 1
          fi
          TAG="v$RELEASE_VERSION"
          TAG_REF="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")"
          if [[ -n "$TAG_REF" ]]; then
            TAG_OBJECT="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '[.object.type, .object.sha] | @tsv')"
            read -r TAG_TYPE TAG_COMMIT <<< "$TAG_OBJECT"
            while [[ "$TAG_TYPE" == tag ]]; do
              TAG_OBJECT="$(gh api "repos/$GH_REPO/git/tags/$TAG_COMMIT" --jq '[.object.type, .object.sha] | @tsv')"
              read -r TAG_TYPE TAG_COMMIT <<< "$TAG_OBJECT"
            done
            if [[ "$TAG_TYPE" != commit ]]; then
              echo "Tag $TAG does not resolve to a commit." >&2
              exit 1
            fi
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG now points to another commit." >&2
              exit 1
            fi
          fi
          RELEASE_FLAGS=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${JARS[@]}" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes "${RELEASE_FLAGS[@]}"
