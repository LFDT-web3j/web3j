name: Release

on:
  push:
    branches: [ 'release/**' ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/build.yml
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  release:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_name.outputs.version }}
      jars_artifact_id: ${{ steps.release_jars.outputs.artifact-id }}
    env:
      JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_CENTRAL_USERNAME }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
      JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD: ${{ secrets.JRELEASER_MAVENCENTRAL_CENTRAL_PASSWORD }}
      JRELEASER_GITHUB_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate release version and tag
        id: release_name
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ || "$VERSION" == *-SNAPSHOT ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points to another commit." >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Stage artifacts locally
        env:
          RELEASE_VERSION: ${{ steps.release_name.outputs.version }}
        run: ./gradlew "-Pversion=$RELEASE_VERSION" publishMavenPublicationToLocalStagingRepository --stacktrace

      - name: Save staged jars for the GitHub release
        id: release_jars
        uses: actions/upload-artifact@v4
        with:
          name: release-jars-${{ github.run_attempt }}
          path: '*/build/staging-deploy/org/web3j/*/${{ steps.release_name.outputs.version }}/*.jar'
          if-no-files-found: error

      - name: Deploy to Maven Central (Portal)
        env:
          RELEASE_VERSION: ${{ steps.release_name.outputs.version }}
        run: ./gradlew "-Pversion=$RELEASE_VERSION" jreleaserDeploy --stacktrace

  javadocs-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Generate and publish Javadocs
        env:
          GITHUB_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: bash ./gradlew "-Pversion=$RELEASE_VERSION" core:javadoc core:gitPublishPush

  git-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download published jars
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release.outputs.jars_artifact_id }}
          path: release-jars
      - name: Create GitHub release at the validated commit
        env:
          GH_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          JARS=()
          while IFS= read -r -d '' JAR; do
            JARS+=("$JAR")
          done < <(find release-jars -type f -name '*.jar' -print0)
          if (( ${#JARS[@]} == 0 )); then
            echo "No published jars were downloaded." >&2
            exit 1
          fi
          TAG="v$RELEASE_VERSION"
          TAG_REF="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")"
          if [[ -n "$TAG_REF" ]]; then
            TAG_COMMIT="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG now points to another commit." >&2
              exit 1
            fi
          fi
          gh release create "$TAG" "${JARS[@]}" \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
