name: Contain eMudhra certificate compromise
description: Prepare an isolated Java truststore and verify all 12 published TLS chains fail
runs:
  using: composite
  steps:
    - name: Prepare and verify Java trust
      shell: bash
      env:
        EMUDHRA_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        (cd "$EMUDHRA_ACTION_PATH" && sha256sum --check --strict SHA256SUMS)
        STORE_DIR="$(mktemp -d "$RUNNER_TEMP/web3j-java-trust.XXXXXX")"
        STORE="$STORE_DIR/cacerts"
        # Do not overwrite the JDK or rely on vendor-specific keytool aliases.
        java "$EMUDHRA_ACTION_PATH/EmudhraTrust.java" prepare "$STORE"
        # Spaces cannot occur in a standard hosted RUNNER_TEMP path; fail explicitly otherwise.
        if [[ "$STORE" == *[[:space:]]* ]]; then
          echo "Unsupported whitespace in isolated truststore path" >&2
          exit 1
        fi
        export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:+$JAVA_TOOL_OPTIONS }-Djavax.net.ssl.trustStore=$STORE -Djavax.net.ssl.trustStorePassword=changeit -Djavax.net.ssl.trustStoreType=JKS"
        java "$EMUDHRA_ACTION_PATH/EmudhraTrust.java" verify "$EMUDHRA_ACTION_PATH/chains"
        java "$EMUDHRA_ACTION_PATH/EmudhraTrust.java" probe github.com raw.githubusercontent.com repo.maven.apache.org central.sonatype.com
        # Verify the effective truststore inside every Gradle daemon, before project scripts.
        GRADLE_INIT_DIR="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
        mkdir -p "$GRADLE_INIT_DIR"
        cp "$EMUDHRA_ACTION_PATH/verify-gradle-trust.gradle" "$GRADLE_INIT_DIR/web3j-emudhra.gradle"
        printf '%s\n' "WEB3J_CI_TRUSTSTORE=$STORE" >> "$GITHUB_ENV"
        printf '%s\n' "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS" >> "$GITHUB_ENV"
